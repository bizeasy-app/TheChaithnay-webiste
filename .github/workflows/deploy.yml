name: Deploy

on:
  # Safety net and scheduled-date posts; Notion edits arrive instantly via
  # /api/notion-webhook, which starts this workflow with source=notion.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Who started this run (notion skips the deploy when nothing published changed)'
        required: false
        default: manual
  push:
    branches: [main]

# A burst of Notion edits queues at most one extra run instead of racing deploys.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DATA_SOURCE_ID: ${{ secrets.NOTION_BLOG_DATA_SOURCE_ID }}
          NOTION_BLOG_DATABASE_ID: ${{ secrets.NOTION_BLOG_DATABASE_ID }}
          NEXT_PUBLIC_SITE_URL: https://thechaithanya.com
          # Production must call same-origin /api/* — never bake a local Worker URL.
          NEXT_PUBLIC_API_BASE: ""

      - name: Hash published content
        id: content
        run: |
          set -euo pipefail
          hash=$(find content public/blog-images -type f ! -name '.gitkeep' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          mkdir -p .deploy
          printf '%s\n' "$hash" > .deploy/hash

      - name: Restore last deployed hash
        uses: actions/cache/restore@v4
        with:
          path: .deploy/last
          key: deployed-content-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            deployed-content-${{ runner.os }}-

      - name: Skip unchanged content
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source }}
        run: |
          last=$(cat .deploy/last/hash 2>/dev/null || echo none)
          auto=false
          if [ "$EVENT" = "schedule" ] || [ "$SOURCE" = "notion" ]; then auto=true; fi
          if [ "$auto" = "true" ] && [ "$last" = "${{ steps.content.outputs.hash }}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lighthouse
        if: steps.gate.outputs.deploy == 'true' && github.event_name == 'push'
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: false

      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID. Add both as GitHub Actions secrets."
            exit 1
          fi
          npx wrangler deploy

      - name: Remember deployed hash
        if: steps.gate.outputs.deploy == 'true'
        run: |
          mkdir -p .deploy/last
          cp .deploy/hash .deploy/last/hash

      - name: Save deployed hash
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/cache/save@v4
        with:
          path: .deploy/last
          key: deployed-content-${{ runner.os }}-${{ github.run_id }}
