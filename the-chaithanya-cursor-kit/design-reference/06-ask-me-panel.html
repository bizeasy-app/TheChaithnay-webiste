<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask The Chaithanya — quick answers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
a{color:#1A1714}a:hover{color:#6B625A}
input::placeholder{color:#8A8178}
</style>
</helmet>
<div style="width: 420px; height: 680px; box-sizing: border-box; background: #F0EEE9; font-family: 'Manrope', system-ui, sans-serif; color: #1A1714; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden">

  <div style="background: #1A1714; color: #F0EEE9; padding: 18px 20px; display: flex; align-items: center; gap: 12px">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><path d="M29.37 9.6 A14 14 0 1 0 29.37 30.4" fill="none" stroke="#F0EEE9" stroke-width="5" stroke-linecap="round"></path><circle cx="34" cy="20" r="4" fill="#E8792B"></circle></svg>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.02em">Ask The Chaithanya</span>
      <span style="font-size: 13px; font-weight: 500; color: #B3A99E">Quick answers from this site</span>
    </div>
    <a href="Main.dc.html" aria-label="Close assistant" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #F0EEE9"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
  </div>

  <div aria-live="polite" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
      <sc-if value="{{m.isUser}}" hint-placeholder-val="{{ false }}">
        <div style="align-self: flex-end; max-width: 80%; padding: 12px 16px; border-radius: 18px 18px 4px 18px; background: #1A1714; color: #F0EEE9; font-size: 15px; line-height: 1.5; font-weight: 600">{{m.text}}</div>
      </sc-if>
      <sc-if value="{{m.isBot}}" hint-placeholder-val="{{ true }}">
        <div style="align-self: flex-start; max-width: 86%; padding: 12px 16px; border-radius: 18px 18px 18px 4px; background: #FFFFFF; border: 1px solid #E2DED6; color: #1A1714; font-size: 15px; line-height: 1.55; font-weight: 500">{{m.text}}</div>
      </sc-if>
    </sc-for>
  </div>

  <div style="padding: 0 20px 12px; display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button type="button" onClick="{{c.ask}}" style="padding: 9px 14px; min-height: 40px; border-radius: 999px; border: 1.5px solid #CFC9BF; background: transparent; color: #1A1714; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer">{{c.q}}</button>
    </sc-for>
  </div>

  <form onSubmit="{{onSend}}" style="padding: 12px 16px 16px; border-top: 1px solid #E2DED6; display: flex; gap: 8px; align-items: center; background: #FFFFFF">
    <label for="ask-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask a question</label>
    <input id="ask-input" type="text" value="{{text}}" onChange="{{onText}}" placeholder="Ask about Chaithanya, products, the blog…" style="flex: 1; min-width: 0; padding: 13px 16px; border-radius: 999px; border: 1.5px solid #CFC9BF; background: #F0EEE9; color: #1A1714; font-size: 15px; font-family: inherit">
    <button type="submit" aria-label="Send" style="width: 46px; height: 46px; border-radius: 50%; border: none; background: #E8792B; color: #1A1714; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":680}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      text: '',
      msgs: [{ who: 'bot', text: "Hi! Ask me who Chaithanya is, what he's building, or where to start on the blog." }]
    };
  }
  answer(q) {
    const s = q.toLowerCase();
    if (s.includes('who') || s.includes('about')) return "Chaithanya is a solo Indian founder with a team of ten, building several products with AI tools like Claude Code. He shares the whole journey — wins and failures — as a weekly founder log.";
    if (s.includes('build') || s.includes('product') || s.includes('bizeasy')) return "Chaithanya is building several products with AI, in public. They'll be shown on the Products page soon — subscribe to the founder log to see them first.";
    if (s.includes('start') || s.includes('blog') || s.includes('read')) return "Start with 'Founder log, week 1', then 'How I build apps with Claude Code as a solo founder'. Both are on the Blog page.";
    if (s.includes('newsletter') || s.includes('email') || s.includes('subscribe') || s.includes('video')) return "A new founder log comes out every Saturday — on YouTube and as an email. Sign up on the Newsletter page.";
    if (s.includes('contact') || s.includes('collab') || s.includes('sponsor')) return "Use the contact form on the Newsletter page and pick a reason — collaboration, sponsorship, podcast, or an experiment idea.";
    return "I don't have an answer for that yet. Try a suggestion below, or send Chaithanya a message on the Contact page.";
  }
  ask(q) {
    if (!q || !q.trim()) return;
    const msgs = this.state.msgs.concat([{ who: 'user', text: q }, { who: 'bot', text: this.answer(q) }]);
    this.setState({ msgs, text: '' });
  }
  renderVals() {
    const qs = ['Who is Chaithanya?', 'What are you building?', 'Where do I start on the blog?', 'How do I get the newsletter?'];
    return {
      text: this.state.text,
      msgs: this.state.msgs.map((m) => ({ text: m.text, isUser: m.who === 'user', isBot: m.who === 'bot' })),
      chips: qs.map((q) => ({ q, ask: () => this.ask(q) })),
      onText: (e) => this.setState({ text: e.target.value }),
      onSend: (e) => { e.preventDefault(); this.ask(this.state.text); }
    };
  }
}
</script>
</body>
</html>
